# ---------------------------------------------------------------------------
# Вологда Брус — раздача собранной статики.
#
# Сайт собирается в .output/public командой `npm run generate` и дальше
# это просто папка с файлами. Всё, что ниже, закрывает пункты этапа 7 ТЗ:
# один основной адрес, постраничные переадресации, защищённое соединение,
# адреса без слеша, защитные заголовки, кэширование и сжатие.
#
# Сертификаты выпускает certbot:
#   certbot --nginx -d vologda-brus.ru -d www.vologda-brus.ru \
#           -d xn--80acbef4bubwkv.xn--p1ai -d www.xn--80acbef4bubwkv.xn--p1ai
# ---------------------------------------------------------------------------

# Срок хранения в браузере по типу файла. Имена в /_nuxt/ и /images/
# содержат хеш или не меняются, поэтому их можно держать год.
map $uri $cache_control {
    default                      "public, max-age=0, must-revalidate";
    ~^/_nuxt/                    "public, max-age=31536000, immutable";
    ~^/images/                   "public, max-age=31536000, immutable";
    ~^/fonts/                    "public, max-age=31536000, immutable";
    ~^/vendor/                   "public, max-age=31536000, immutable";
    ~*\.(?:ico|svg|png|webp)$    "public, max-age=2592000";
}

# --- 1. Незащищённый протокол: только перенаправление ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name vologda-brus.ru www.vologda-brus.ru
                xn--80acbef4bubwkv.xn--p1ai www.xn--80acbef4bubwkv.xn--p1ai;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vologda-brus.ru$request_uri; }
}

# --- 2. www и кириллический домен: постранично на основной адрес ----------
# Человек по старой ссылке попадает на ту же страницу, а не на главную.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vologda-brus.ru
                xn--80acbef4bubwkv.xn--p1ai www.xn--80acbef4bubwkv.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/vologda-brus.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vologda-brus.ru/privkey.pem;

    # Адреса статей на Тильде лежали по /tpost/<хеш>-<адрес>
    location ~ ^/tpost/[a-z0-9]+-(?<post>.+)$ {
        return 301 https://vologda-brus.ru/blog/$post;
    }
    location = /error404 { return 301 https://vologda-brus.ru/404; }

    return 301 https://vologda-brus.ru$request_uri;
}

# --- 3. Основной адрес -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vologda-brus.ru;

    ssl_certificate     /etc/letsencrypt/live/vologda-brus.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vologda-brus.ru/privkey.pem;

    root /var/www/vologda-brus/public;
    index index.html;
    charset utf-8;

    # --- Защитные заголовки ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control             $cache_control always;

    # --- Сжатие ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml
               application/manifest+json font/ttf;

    # Если собран brotli-модуль, он заметно лучше gzip на HTML и CSS
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/javascript
    #              application/json application/xml image/svg+xml;

    # --- Адреса без завершающего слеша ---
    # /blog/ и /blog не должны быть двумя разными страницами.
    rewrite ^/(.*)/$ /$1 permanent;

    # Старые адреса статей Тильды
    location ~ ^/tpost/[a-z0-9]+-(?<post>.+)$ { return 301 /blog/$post; }
    location = /error404 { return 301 /404; }

    # --- Статика ---
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Отдаём собранную заранее страницу, а не пустую оболочку Nuxt
    error_page 404 /404/index.html;
    location = /404/index.html { internal; }

    access_log /var/log/nginx/vologda-brus.access.log;
    error_log  /var/log/nginx/vologda-brus.error.log;
}
